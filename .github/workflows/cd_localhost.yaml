name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      # Bağımlılıkları yükle ve ortamı hazırla (Yetki istemeyen, doğrudan nokta atışı yöntem)
      - name: Install dependencies
        run: |
          if (Test-Path .venv) {
            echo "Virtual environment exists."
          } else {
            echo "Creating virtual environment using local Python..."
            & "C:\Users\koseb\AppData\Local\Programs\Python\Python312\python.exe" -m venv .venv
          }
          & .venv\Scripts\Activate.ps1
          pip install -r requirements.txt

      # Eğer daha önce port 8000'de çalışan bir Django varsa onu kapat
      - name: Kill previous app instance
        run: |
          echo "Checking for existing process on port 8000..."
          $portMatches = Get-NetTCPConnection -LocalPort 8000 -ErrorAction SilentlyContinue
          if ($portMatches) {
            foreach ($match in $portMatches) {
              if ($match.OwningProcess -gt 0) {
                echo "Killing process ID: $($match.OwningProcess)"
                Stop-Process -Id $match.OwningProcess -Force -ErrorAction SilentlyContinue
              }
            }
          } else {
            echo "No process running on port 8000."
          }

      # Yeni versiyonu yerel Python yoluyla arka planda sorunsuzca başlat
      - name: Launch new version in background
        run: |
          echo "Starting Django server in background..."
          & .venv\Scripts\Activate.ps1
          Start-Process "C:\Users\koseb\AppData\Local\Programs\Python\Python312\python.exe" -ArgumentList "manage.py runserver 127.0.0.1:8000" -NoNewWindow
          echo "Application deployed successfully on localhost:8000"