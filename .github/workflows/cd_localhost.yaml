name: CD Localhost

# b. Trigger: Sadece CI Semantic Versioning workflow'u main branch'inde başarıyla tamamlandığında çalışır
on:
  workflow_run:
    workflows: ["CI Versioning"] # Sizin CI workflow'unuzun "name" değeriyle birebir aynı olmalı
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    # Sadece CI başarıyla bittiyse bu job'ı çalıştır
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # c. Environment: Lokal self-hosted runner üzerinde çalışacak
    runs-on: self-hosted

    steps:
      # d. Deployment Steps: En güncel kodu çek
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' #python sürümü

      # Bağımlılıkları yükle ve ortamı hazırla
      - name: Install dependencies
        run: |
          if (Test-Path .venv) {
            echo "Virtual environment exists."
          } else {
            python -m venv .venv
          }
          & .venv\Scripts\Activate.ps1
          pip install -r requirements.txt

      # Eğer daha önce arka planda çalışan bir Django (port 8000) varsa onu kapat (kill)
      - name: Kill previous app instance
        run: |
          echo "Checking for existing process on port 8000..."
          $portMatches = Get-NetTCPConnection -LocalPort 8000 -ErrorAction SilentlyContinue
          if ($portMatches) {
            foreach ($match in $portMatches) {
              if ($match.OwningProcess -gt 0) {
                echo "Killing process ID: $($match.OwningProcess)"
                Stop-Process -Id $match.OwningProcess -Force -ErrorAction SilentlyContinue
              }
            }
          } else {
            echo "No process running on port 8000."
          }

      # Yeni versiyonu arka planda başlat (launch in the background)
      - name: Launch new version in background
        run: |
          echo "Starting Django server in background..."
          & .venv\Scripts\Activate.ps1
          # Start-Process ile Django'yu arka planda görünmez bir işlem olarak başlatıyoruz
          Start-Process python -ArgumentList "manage.py runserver 127.0.0.1:8000" -NoNewWindow
          echo "Application deployed successfully on localhost:8000"