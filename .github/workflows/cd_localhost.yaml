name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Versioning"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      # Sanal ortam klasör izinlerine takılmamak için doğrudan sistem context'ini kullanıyoruz
      - name: Install dependencies
        run: |
          echo "Installing dependencies using system context..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Eğer port 8000'de çalışan eski bir Django süreci varsa güvenli bir şekilde kapatıyoruz
      - name: Kill previous app instance
        run: |
          echo "Checking for existing process on port 8000..."
          $portMatches = Get-NetTCPConnection -LocalPort 8000 -ErrorAction SilentlyContinue
          if ($portMatches) {
            foreach ($match in $portMatches) {
              if ($match.OwningProcess -gt 0) {
                echo "Killing process ID: $($match.OwningProcess)"
                Stop-Process -Id $match.OwningProcess -Force -ErrorAction SilentlyContinue
              }
            }
          } else {
            echo "No process running on port 8000."
          }

      # Uygulamayı doğrudan arka planda global python komutuyla başlatıyoruz
      - name: Launch new version in background
        run: |
          echo "Starting Django server..."
          Start-Process python -ArgumentList "manage.py runserver 127.0.0.1:8000" -NoNewWindow
          echo "Application deployed successfully on localhost:8000"